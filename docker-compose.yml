services:
  website:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8140:8000"
    env_file:
      - .env
    volumes:
      - ventures_data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ventures_data:
